# Read the Docs configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The BSM3 documentation build is hermetic: it renders hand-written Markdown
# and never imports the package, so it installs only docs/requirements.txt.
# The validated geometry stack (CSDL_alpha, lsdo_function_spaces, JAX, gmsh)
# is deliberately NOT installed here. If a future revision adds autodoc, that
# installation must pin CSDL_alpha to 73a9efd1033016a835779db10a9b9e81ed2254ce
# and lsdo_function_spaces to 307ad3aabfff31c6fb44ddf51bc0dcc41a60c420, with
# --no-deps on lsdo_function_spaces.

version: 2

build:
  os: ubuntu-22.04
  tools:
    # Matches the validated BSM3 stack.
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
  - htmlzip

python:
  install:
    - requirements: docs/requirements.txt
